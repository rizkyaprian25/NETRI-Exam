name: Build Exam NETRI (iOS & Android)

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol "Run workflow" di tab Actions GitHub

jobs:
  # ==========================================
  # JOB 1: BUILD IOS (.IPA) PADA SERVER MACOS
  # ==========================================
  build-ios:
    name: Build iOS IPA (Server macOS Cloud)
    runs-on: macos-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ambil Dependensi Flutter
        run: flutter pub get

      - name: Jalankan Unit & Smoke Test
        run: flutter test

      - name: Pasang Pods iOS (CocoaPods)
        run: |
          cd ios
          pod install
          cd ..

      - name: Kompilasi Proyek iOS (Release Mode)
        run: flutter build ios --release --no-codesign

      - name: Kemas Binary Runner.app Menjadi File .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Exam-NETRI.ipa Payload
          echo "File Exam-NETRI.ipa berhasil dikemas."

      - name: Unggah Artefak Installer iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: Exam-NETRI-iOS-IPA
          path: Exam-NETRI.ipa
          retention-days: 30

  # ==========================================
  # JOB 2: BUILD ANDROID (.APK) PADA UBUNTU
  # ==========================================
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ambil Dependensi Flutter
        run: flutter pub get

      - name: Kompilasi APK Release Android
        run: flutter build apk --release

      - name: Unggah Artefak Installer Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Exam-NETRI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
